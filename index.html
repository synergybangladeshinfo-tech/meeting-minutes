<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মিটিং মিনিটস রেকর্ডার</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d6e5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#eef2f6; --panel:#ffffff; --line:#e2e8f0; --text:#0f172a; --muted:#64748b;
    --soft:#f8fafc; --brand:#0d6e5c; --brand2:#0ea371; --accent:#b45309; --danger:#b91c1c;
    --ok:#166534; --shade:#ecfdf5; --shline:#a7f3d0; --note:#fffbeb; --noteline:#fde68a; --notetext:#92400e;
    --info:#eff6ff; --infoline:#bfdbfe; --infotext:#1e40af; --dropline:#94a3b8;
  }
  [data-theme="dark"]{
    --bg:#0b1220; --panel:#131c2e; --line:#26334a; --text:#e6edf7; --muted:#93a4bd;
    --soft:#0f1829; --brand:#22c88f; --brand2:#16a97a; --accent:#d97706; --danger:#f87171;
    --ok:#4ade80; --shade:#0e2a22; --shline:#1e5f4a; --note:#2a1f0a; --noteline:#5a4210; --notetext:#fcd34d;
    --info:#0f2036; --infoline:#1e3a5f; --infotext:#93c5fd; --dropline:#3d4c66;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Nirmala UI","Hind Siliguri","Segoe UI",system-ui,sans-serif;
    font-size:15px; line-height:1.6; transition:background .2s,color .2s;
  }
  header{
    background:linear-gradient(120deg,var(--brand),var(--brand2)); color:#fff;
    padding:16px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  [data-theme="dark"] header{color:#04170f}
  header h1{margin:0; font-size:21px; font-weight:700}
  header .sub{opacity:.88; font-size:13px}
  .tools{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .tools .tbtn{
    background:rgba(255,255,255,.18); color:inherit; border:1px solid rgba(255,255,255,.35);
    padding:7px 12px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .tools .tbtn:hover{background:rgba(255,255,255,.3)}
  .tools .save{font-size:12px; opacity:.9; width:100%; text-align:right}
  .wrap{max-width:1180px; margin:0 auto; padding:20px 16px 60px}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:18px}
  .card h2{margin:0 0 14px; font-size:16px; color:var(--brand); display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .card h2 .n{background:var(--brand); color:var(--panel); width:22px; height:22px; border-radius:50%;
              display:inline-flex; align-items:center; justify-content:center; font-size:12px; flex:none}
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; font-weight:600}
  input,textarea,select{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:14px; background:var(--panel); color:var(--text);
  }
  textarea{resize:vertical}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand2); border-color:var(--brand2)}
  input::placeholder,textarea::placeholder{color:var(--muted); opacity:.7}
  .row{display:flex; gap:12px; flex-wrap:wrap}
  .row>div{flex:1; min-width:150px}
  button{
    font-family:inherit; font-size:14px; font-weight:600; border:0; border-radius:8px;
    padding:10px 16px; cursor:pointer; background:var(--brand); color:#fff;
  }
  [data-theme="dark"] button{color:#04170f}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.45; cursor:not-allowed; filter:none}
  button.ghost{background:var(--panel); color:var(--brand); border:1.5px solid var(--brand)}
  button.warn{background:var(--accent); color:#fff}
  button.stop{background:var(--danger); color:#fff}
  button.sm{padding:6px 11px; font-size:13px}
  .bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .status{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-left:auto}
  .dot{width:11px; height:11px; border-radius:50%; background:var(--line)}
  .dot.live{background:#dc2626; animation:pulse 1.2s infinite}
  .dot.pause{background:#f59e0b}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  #transcript{
    min-height:260px; max-height:420px; overflow-y:auto; background:var(--soft);
    border:1px solid var(--line); border-radius:8px; padding:14px; margin-top:12px;
  }
  .seg{margin-bottom:9px; padding-bottom:9px; border-bottom:1px dashed var(--line)}
  .seg:last-child{border:0}
  .seg .t{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  .seg .sp{font-weight:700; color:var(--brand)}
  .seg .txt{display:block; margin-top:2px}
  #interim{color:var(--muted); font-style:italic}
  .item{display:flex; gap:8px; align-items:flex-start; margin-bottom:8px}
  .item input{flex:1}
  .item .del,.del{background:rgba(185,28,28,.12); color:var(--danger); padding:8px 10px; border-radius:8px; font-size:13px}
  .hint{font-size:12px; color:var(--muted); margin-top:6px}
  .pill{display:inline-block; background:var(--shade); color:var(--ok); border:1px solid var(--shline);
        padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600}
  .warnbox{background:var(--note); border:1px solid var(--noteline); color:var(--notetext);
           padding:10px 12px; border-radius:8px; font-size:13px; margin-top:10px; line-height:1.7}
  .infobox{background:var(--info); border:1px solid var(--infoline); color:var(--infotext);
           padding:12px 14px; border-radius:8px; font-size:13px; margin-top:10px; line-height:1.7}
  table.mini{width:100%; border-collapse:collapse; font-size:13px}
  table.mini th,table.mini td{border:1px solid var(--line); padding:6px 8px; text-align:left}
  table.mini th{background:var(--soft); font-size:12px; color:var(--muted)}
  table.mini td input{border:0; padding:4px; background:transparent}
  .foot{text-align:center; color:var(--muted); font-size:12px; margin-top:24px}
  #drop{
    border:2px dashed var(--dropline); border-radius:12px; padding:30px 18px; text-align:center;
    background:var(--soft); cursor:pointer; transition:.15s;
  }
  #drop:hover,#drop.over{border-color:var(--brand2); background:var(--shade)}
  #drop .big{font-size:34px}
  #drop .t1{font-weight:700; margin-top:6px}
  #drop .t2{font-size:12px; color:var(--muted)}
  .prog{height:9px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:12px; display:none}
  .prog>i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--brand),var(--brand2)); transition:width .3s}
  #progTxt{font-size:13px; color:var(--brand); margin-top:8px; display:none; font-weight:600}
  details.set{border:1px solid var(--line); border-radius:10px; padding:10px 14px; background:var(--soft); margin-bottom:14px}
  details.set summary{cursor:pointer; font-weight:700; font-size:13px; color:var(--brand)}
  details.set[open] summary{margin-bottom:8px}
  .ok{color:var(--ok); font-weight:600}
  .err{color:var(--danger); font-weight:600}
  .exportbar{position:sticky; bottom:0; background:var(--panel); border-top:2px solid var(--brand);
             padding:14px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
             border-radius:12px 12px 0 0; box-shadow:0 -4px 16px rgba(0,0,0,.12)}
  .deskonly{display:none; background:var(--note); border:1px solid var(--noteline); color:var(--notetext);
            padding:12px 14px; border-radius:8px; font-size:13px; line-height:1.7; margin-top:10px}
  /* ---- mobile ---- */
  @media (max-width:640px){
    header{padding:14px 16px; gap:10px}
    header h1{font-size:18px}
    header .sub{font-size:11px}
    .tools{width:100%; margin-left:0}
    .wrap{padding:12px 10px 40px}
    .card{padding:14px; border-radius:10px; margin-bottom:14px}
    .card h2{font-size:15px}
    input,textarea,select{font-size:16px; padding:11px}
    button{padding:13px 16px; font-size:15px; flex:1 1 auto}
    button.sm{padding:9px 12px; font-size:13px; flex:0 0 auto}
    .status{margin-left:0; width:100%; justify-content:flex-start}
    .row>div{min-width:100%; flex:1 1 100%}
    #transcript{max-height:300px; padding:11px}
    #drop{padding:24px 12px}
    table.mini{font-size:12px}
    table.mini th,table.mini td{padding:5px}
    .exportbar{padding:12px 10px; gap:8px}
  }
</style>
</head>
<body>

<header>
  <div style="font-size:30px">🎙️</div>
  <div>
    <h1 data-t="appName">মিটিং মিনিটস রেকর্ডার</h1>
    <div class="sub" data-t="appSub">ভয়েস রেকর্ড → স্বয়ংক্রিয় ট্রান্সক্রিপ্ট → সুন্দর Word (.docx) ফাইল</div>
  </div>
  <div class="tools">
    <button class="tbtn" id="btnNew" title="New meeting">🆕</button>
    <button class="tbtn" id="btnLang" title="Language">🌐 English</button>
    <button class="tbtn" id="btnTheme" title="Theme">🌙</button>
    <span class="save" id="autosave"></span>
  </div>
</header>

<div class="wrap">

  <!-- 1 -->
  <div class="card">
    <h2><span class="n">1</span><span data-t="s1">সভার তথ্য</span></h2>
    <div class="row">
      <div style="flex:2"><label data-t="lTitle"></label><input id="mTitle" data-tp="phTitle"></div>
      <div><label data-t="lNo"></label><input id="mNo" data-tp="phNo"></div>
    </div>
    <div class="row">
      <div><label data-t="lDate"></label><input type="date" id="mDate"></div>
      <div><label data-t="lTime"></label><input id="mTime" data-tp="phTime"></div>
      <div><label data-t="lVenue"></label><input id="mVenue" data-tp="phVenue"></div>
    </div>
    <div class="row">
      <div><label data-t="lChair"></label><input id="mChair" data-tp="phName"></div>
      <div><label data-t="lSec"></label><input id="mSecretary" data-tp="phName"></div>
    </div>
    <div class="row">
      <div><label data-t="lPresent"></label><textarea id="mPresent" rows="4" data-tp="phPresent"></textarea></div>
      <div><label data-t="lAbsent"></label><textarea id="mAbsent" rows="4" data-tp="phAbsent"></textarea></div>
    </div>
    <label data-t="lAgenda"></label>
    <textarea id="mAgenda" rows="4" data-tp="phAgenda"></textarea>
  </div>

  <!-- 2 -->
  <div class="card">
    <h2><span class="n">2</span><span data-t="s2">ভয়েস রেকর্ডিং</span></h2>
    <div class="row" style="margin-bottom:12px">
      <div style="max-width:290px">
        <label data-t="lRecMode"></label>
        <select id="recMode">
          <option value="whisper" data-t="optWhisper"></option>
          <option value="live" data-t="optLive"></option>
        </select>
      </div>
      <div style="max-width:230px">
        <label data-t="lSpokenLang"></label>
        <select id="lang">
          <option value="bn-BD">বাংলা (বাংলাদেশ)</option>
          <option value="en-US">English (US)</option>
          <option value="en-IN">English (India)</option>
          <option value="hi-IN">हिन्दी</option>
        </select>
      </div>
      <div style="max-width:230px">
        <label data-t="lSpeaker"></label>
        <input id="speaker" data-tp="phSpeaker">
      </div>
    </div>
    <div class="bar">
      <button id="btnStart"></button>
      <button id="btnPause" class="warn" disabled></button>
      <button id="btnStop" class="stop" disabled></button>
      <button id="btnClear" class="ghost"></button>
      <div class="status"><span class="dot" id="dot"></span><span id="stateTxt"></span> · <span id="timer">00:00:00</span></div>
    </div>
    <div class="hint" id="hintRec"></div>
    <div class="hint" data-t="hintLang"></div>
    <div id="fileWarn" class="warnbox" data-th="fileWarn" style="display:none"></div>
    <div id="recErr" class="warnbox" style="display:none"></div>
    <div id="levelWrap" style="display:none; margin-top:12px">
      <div class="hint" style="margin:0 0 4px"><span data-t="micLevel"></span> <span id="levelTxt" style="opacity:.7"></span></div>
      <div class="prog" style="display:block; height:7px"><i id="levelBar" style="background:var(--brand2)"></i></div>
    </div>
    <div id="transcript" contenteditable="true" spellcheck="false"><div id="interim"></div></div>
    <div class="hint" data-t="hintEdit"></div>
    <div id="noSupport" class="warnbox" data-th="noSupport" style="display:none"></div>
  </div>

  <!-- 3 -->
  <div class="card">
    <h2><span class="n">3</span><span data-t="s3">অডিও আপলোড</span> <span class="pill" data-t="pillFree"></span></h2>

    <details class="set" id="apiBox">
      <summary><span data-t="setTitle"></span> — <span id="keyState"></span></summary>
      <div class="row">
        <div style="max-width:220px">
          <label data-t="lService"></label>
          <select id="provider">
            <option value="groq" data-t="optGroq"></option>
            <option value="openai" data-t="optOpenai"></option>
          </select>
        </div>
        <div>
          <label>API Key</label>
          <input id="apiKey" type="password" placeholder="gsk_... / sk-...">
        </div>
      </div>
      <div class="row">
        <div><label data-t="lStt"></label><input id="sttModel"></div>
        <div><label data-t="lLlm"></label><input id="llmModel"></div>
        <div style="max-width:190px"><label data-t="lAudioLang"></label>
          <select id="upLang">
            <option value="" data-t="optAutoLang"></option>
            <option value="bn" data-t="optBn"></option>
            <option value="en" data-t="optEn"></option>
          </select>
        </div>
      </div>
      <div class="bar" style="margin-top:10px">
        <button class="ghost sm" id="btnSaveKey"></button>
        <button class="ghost sm" id="btnTestKey"></button>
        <button class="sm" id="btnSelfTest"></button>
        <span id="keyMsg" class="hint" style="margin:0"></span>
      </div>
      <div id="testOut" class="hint" style="display:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:10px"></div>
      <div class="hint" data-th="keyNote"></div>
    </details>

    <div id="drop">
      <div class="big">🎧</div>
      <div class="t1" data-t="dropT1"></div>
      <div class="t2" data-t="dropT2"></div>
      <input type="file" id="fileIn" accept="audio/*,video/mp4,.m4a,.mp3,.wav,.ogg,.webm" style="display:none">
    </div>
    <div class="prog" id="prog"><i></i></div>
    <div id="progTxt"></div>
    <div class="bar" style="margin-top:12px">
      <button id="btnAI" class="warn"></button>
      <button id="btnCancel" class="ghost sm" style="display:none"></button>
      <span class="hint" style="margin:0" data-t="aiHint"></span>
    </div>
    <div class="hint" data-t="upHint"></div>
  </div>

  <!-- 4 -->
  <div class="card" style="border-color:var(--brand2); border-width:2px">
    <h2><span class="n">4</span><span data-t="s4">অনলাইন মিটিং</span></h2>
    <div class="hint" style="margin-top:0" data-t="meetIntro"></div>
    <div class="bar" style="margin-top:12px">
      <button id="btnMeet"></button>
      <button id="btnMeetStop" class="stop" disabled></button>
      <div class="status"><span class="dot" id="mdot"></span><span id="mState"></span> · <span id="mTimer">00:00:00</span></div>
    </div>
    <label style="margin-top:12px"><input type="checkbox" id="autoFinish" checked style="width:auto">
      <span data-t="autoFinish"></span></label>
    <div class="infobox" data-th="meetHow"></div>
    <div id="meetInfo" class="hint"></div>
    <div id="meetNoMobile" class="deskonly" data-th="meetNoMobile"></div>
  </div>

  <!-- AI summary -->
  <div class="card" id="sumCard" style="display:none">
    <h2><span class="n">✦</span><span data-t="sSum">সারসংক্ষেপ ও আলোচনা</span></h2>
    <label data-t="lSummary"></label>
    <textarea id="mSummary" rows="4"></textarea>
    <label data-t="lDiscussion"></label>
    <textarea id="mDiscussion" rows="10" data-tp="phDiscussion"></textarea>
    <div class="hint" data-th="discHint"></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2><span class="n">5</span><span data-t="s5">সিদ্ধান্তসমূহ</span></h2>
      <div id="decisions"></div>
      <div class="bar" style="margin-top:8px">
        <button class="ghost sm" id="btnAddDec"></button>
        <button class="ghost sm" id="btnExtract"></button>
      </div>
      <div class="hint" data-t="decHint"></div>
    </div>

    <div class="card">
      <h2><span class="n">6</span><span data-t="s6">করণীয়</span></h2>
      <table class="mini">
        <thead><tr>
          <th style="width:44%" data-t="thTask"></th>
          <th style="width:26%" data-t="thWho"></th>
          <th style="width:22%" data-t="thDue"></th>
          <th></th>
        </tr></thead>
        <tbody id="actions"></tbody>
      </table>
      <div class="bar" style="margin-top:10px">
        <button class="ghost sm" id="btnAddAct"></button>
      </div>
    </div>
  </div>

  <!-- 7 -->
  <div class="card">
    <h2><span class="n">7</span><span data-t="s7">ফাইল তৈরি</span></h2>
    <div class="row">
      <div>
        <label><input type="checkbox" id="incTranscript" checked style="width:auto"> <span data-t="optIncTr"></span></label>
        <label><input type="checkbox" id="incTime" checked style="width:auto"> <span data-t="optIncTime"></span></label>
        <label><input type="checkbox" id="incSign" checked style="width:auto"> <span data-t="optIncSign"></span></label>
      </div>
      <div>
        <label data-t="lOrg"></label>
        <input id="mOrg" data-tp="phOrg">
      </div>
    </div>
    <div class="exportbar">
      <button id="btnDocx"></button>
      <button id="btnAudio" class="ghost" disabled></button>
      <button id="btnTxt" class="ghost"></button>
      <button id="btnCopy" class="ghost"></button>
      <span class="pill" id="wordCount"></span>
    </div>
  </div>

  <div class="foot" data-t="foot"></div>
</div>

<script>
/* ============================================================
   PART 0 — dictionary (bn / en)
   ============================================================ */
const DICT = {
bn:{
 appName:'মিটিং মিনিটস রেকর্ডার',
 appSub:'ভয়েস রেকর্ড → স্বয়ংক্রিয় ট্রান্সক্রিপ্ট → সুন্দর Word (.docx) ফাইল',
 langBtn:'🌐 English', notSaved:'সেভ হয়নি', savedAt:'✓ সেভ হয়েছে ', saveFail:'সেভ করা যায়নি',
 s1:'সভার তথ্য',
 lTitle:'সভার শিরোনাম', phTitle:'যেমন: মাসিক ব্যবস্থাপনা সভা',
 lNo:'সভা নং', phNo:'০৭/২০২৬',

 lChair:'সভাপতি', lSec:'মিনিটস প্রস্তুতকারী', phName:'নাম ও পদবি',
 lPresent:'উপস্থিত সদস্য (প্রতি লাইনে একজন)', phPresent:'১. মোঃ রহিম উদ্দিন — ব্যবস্থাপক\n২. Farhana Akter — HR Officer',
 lAbsent:'অনুপস্থিত', phAbsent:'নাম (কারণসহ)',
 lAgenda:'আলোচ্যসূচি (প্রতি লাইনে একটি)', phAgenda:'১. পূর্ববর্তী সভার কার্যবিবরণী অনুমোদন\n২. জুলাই মাসের বিক্রয় পর্যালোচনা\n৩. বিবিধ',

let LANG = 'bn';
const T = k => (DICT[LANG][k] !== undefined ? DICT[LANG][k] : (DICT.bn[k] || k));
const $ = id => document.getElementById(id);

const num = n => LANG === 'bn' ? String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]) : String(n);

function applyLang(){
  document.documentElement.lang = LANG;
  document.title = T('appName');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T(el.dataset.t));
  document.querySelectorAll('[data-th]').forEach(el => el.innerHTML = T(el.dataset.th));
  document.querySelectorAll('[data-tp]').forEach(el => el.placeholder = T(el.dataset.tp));
  const B = {btnLang:'langBtn', btnStart:'bStart', btnPause:'bPause', btnStop:'bStop', btnClear:'bClear',
             btnSaveKey:'bSaveKey', btnTestKey:'bTestKey', btnSelfTest:'bSelfTest', btnAI:'bAI', btnCancel:'bCancel',
             btnMeet:'bMeet', btnMeetStop:'bMeetStop', btnAddDec:'bAddDec', btnExtract:'bExtract', btnAddAct:'bAddAct',
             btnDocx:'bDocx', btnAudio:'bAudio', btnTxt:'bTxt', btnCopy:'bCopy'};
  for (const id in B) $(id).textContent = T(B[id]);
  if (S.paused) $('btnStart').textContent = T('bResume');
  $('keyState').textContent = $('apiKey').value ? T('keySet') : T('keyNone');
  if (!S.recording && !S.paused) $('stateTxt').textContent = T('stReady');
  if (!M.running) $('mState').textContent = $('btnMeet').disabled ? T('meetDesktopOnly') : T('stReady');
  if (!$('autosave').dataset.stamp) $('autosave').textContent = T('notSaved');
  const liveMode = $('recMode').value === 'live';
  $('hintRec').innerHTML = T(liveMode ? 'hintLive' : 'hintWhisper');
  $('noSupport').style.display = (!SR && liveMode) ? 'block' : 'none';
  $('fileWarn').style.display = (location.protocol === 'file:' && liveMode) ? 'block' : 'none';
  renderTranscript(); renderActions(); countWords();
  try { localStorage.setItem('mmr_lang', LANG); } catch(e){}
}
$('btnLang').onclick = () => { LANG = LANG === 'bn' ? 'en' : 'bn'; applyLang(); };

/* নতুন সভা — সব ঘর খালি করে শুরু */
function resetAll(){
  if (S.recording || M.running) return;
  if (!confirm(T('confirmNew'))) return;
  FIELDS.forEach(k => { if (k !== 'mOrg') $(k).value = ''; });
  $('mDate').value = new Date().toISOString().slice(0,10);
  S.segs = []; S.decisions = []; S.actions = []; S.elapsed = 0;
  S.recording = false; S.paused = false;
  M.offset = 0; M.parts = 0; M.queue = [];
  $('timer').textContent = '00:00:00'; $('mTimer').textContent = '00:00:00';
  $('sumCard').style.display = 'none';
  renderTranscript(); renderDecisions(); renderActions();
  try { localStorage.removeItem('mmr_draft'); } catch(e){}
  $('autosave').dataset.stamp = ''; $('autosave').textContent = T('newDone');
  setProg(null); hideRecErr(); setState(false, false, T('stReady'));
  window.scrollTo({ top:0, behavior:'smooth' });
}
$('btnNew').onclick = resetAll;

/* ============================================================
   PART 1 — state
   ============================================================ */
const S = { segs:[], decisions:[], actions:[], recording:false, paused:false, startedAt:0, elapsed:0 };
$('mDate').value = new Date().toISOString().slice(0,10);

/* ============================================================
   PART 2 — live speech recognition
   ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, wantRunning = false, mediaRec = null, chunks = [], stream = null;
if (!SR) { $('noSupport').style.display='block'; $('btnStart').disabled = true; }

function buildRec(){
  const r = new SR();
  r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
  r.lang = $('lang').value;
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const txt = e.results[i][0].transcript.trim();
      if (e.results[i].isFinal){ if (txt) pushSeg(txt); } else interim += txt + ' ';
    }
    $('interim').textContent = interim;
  };
  r.onerror = ev => {
    const e = ev.error;
    if (e === 'not-allowed' || e === 'service-not-allowed'){
      setState(false,false,T('stMic')); wantRunning = false;
      showRecErr(e === 'not-allowed' ? T('micDenied') : T('errService'));
    } else if (e === 'network'){
      wantRunning = false; setState(false,false,T('stDone'));
      showRecErr(T('errNetwork'));
    } else if (e === 'audio-capture'){
      wantRunning = false; setState(false,false,T('stDone'));
      showRecErr(T('errCapture'));
    } else if (e === 'no-speech'){
      showRecErr(T('errNoSpeech'));               // চলতে থাকবে, শুধু জানিয়ে রাখা
    } else if (e !== 'aborted'){
      showRecErr(T('errOther') + e);
    }
  };
  r.onend = () => { if (wantRunning) { try { r.start(); } catch(e){} } };
  return r;
}
function showRecErr(msg){
  const b = $('recErr'); b.innerHTML = msg; b.style.display = 'block';
}
function hideRecErr(){ $('recErr').style.display = 'none'; }

/* মাইক ঠিকমতো শুনছে কিনা চোখে দেখার জন্য */
let levelCtx = null, levelRaf = null;
function startLevel(stream){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    levelCtx = new AC();
    const an = levelCtx.createAnalyser(); an.fftSize = 1024;
    levelCtx.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    $('levelWrap').style.display = 'block';
    let quiet = 0;
    const draw = () => {
      an.getByteTimeDomainData(buf);
      let peak = 0;
      for (let i=0;i<buf.length;i++) peak = Math.max(peak, Math.abs(buf[i]-128));
      const pct = Math.min(100, peak/64*100);
      $('levelBar').style.width = pct + '%';
      quiet = pct < 3 ? quiet + 1 : 0;
      $('levelTxt').textContent = quiet > 150 ? '— ' + T('micQuiet') : '';
      levelRaf = requestAnimationFrame(draw);
    };
    draw();
  } catch(e){}

  catch(e){ return showRecErr(T('micDenied')); }
  hideRecErr(); startLevel(mic);
  const AC = window.AudioContext || window.webkitAudioContext;
  M.ac = new AC(); M.dest = M.ac.createMediaStreamDestination();
  M.ac.createMediaStreamSource(mic).connect(M.dest);

  M.started = Date.now(); M.offset = 0; M.parts = 0;

async function decodeToMono16k(file){
  const ab = await file.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC(); let buf;
  try { buf = await ac.decodeAudioData(ab); } finally { ac.close(); }
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(buf.duration * 16000)), 16000);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  return (await off.startRendering()).getChannelData(0);

function splitPoints(pcm, sr, chunkSec){
  const step = chunkSec * sr, win = Math.floor(sr * 0.25), search = 20 * sr;
  const pts = [0]; let target = step;
  while (target < pcm.length - sr){
    let best = target, bestE = Infinity;
    const from = Math.max(pts[pts.length-1] + sr*30, target - search);
    const to   = Math.min(pcm.length - win, target + search);
    for (let i = from; i < to; i += win){
      let e = 0;
      for (let j = i; j < i + win; j += 4) e += pcm[j] * pcm[j];
      if (e < bestE){ bestE = e; best = i; }
    }
    pts.push(best); target = best + step;
  }
  pts.push(pcm.length);
  return pts;
}
function encodeWav(pcm, sr){
  const n = pcm.length, buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
  const wr = (o,s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  wr(0,'RIFF'); v.setUint32(4, 36 + n*2, true); wr(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  wr(36,'data'); v.setUint32(40, n*2, true);
  for (let i=0;i<n;i++){ let s = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44+i*2, s<0 ? s*0x8000 : s*0x7FFF, true); }
  return new Blob([buf], { type:'audio/wav' });
}

/* ---- বড় ফাইল টুকরো টুকরো করে পড়া (WAV / MP3 / M4A — যেকোনো দৈর্ঘ্য) ---- */
const rdb = async (f,a,b) => new Uint8Array(await f.slice(a, Math.min(b, f.size)).arrayBuffer());
const be32 = (u,i) => (u[i]<<24|u[i+1]<<16|u[i+2]<<8|u[i+3])>>>0;
const str4 = (u,i) => String.fromCharCode(u[i],u[i+1],u[i+2],u[i+3]);
function cat(list){
  let n = 0; list.forEach(a => n += a.length);
  const out = new Uint8Array(n); let o = 0;
  list.forEach(a => { out.set(a,o); o += a.length; });
  return out;
}
async function detectType(file){
  const h = await rdb(file,0,16);
  if (str4(h,0)==='RIFF' && str4(h,8)==='WAVE') return 'wav';
  if (str4(h,4)==='ftyp') return 'mp4';
  if (str4(h,0).slice(0,3)==='ID3') return 'mp3';
  if (h[0]===0xFF && (h[1]&0xE0)===0xE0) return 'mp3';
  return 'other';
}
async function* wavSlices(file, sliceSec){
  const head = await rdb(file,0,Math.min(file.size, 65536));
  const dv = new DataView(head.buffer, head.byteOffset, head.length);
  let p = 12, fmt = null, dataOff = 0, dataLen = 0;
  while (p + 8 <= head.length){
    const id = str4(head,p), sz = dv.getUint32(p+4, true);
    if (id === 'fmt ') fmt = { ch:dv.getUint16(p+10,true), sr:dv.getUint32(p+12,true), bits:dv.getUint16(p+22,true) };
    if (id === 'data'){ dataOff = p+8; dataLen = sz || (file.size - dataOff); break; }
    p += 8 + sz + (sz & 1);
  }
  if (!fmt || !dataOff) throw new Error('WAV_PARSE');
  const block = fmt.ch * (fmt.bits/8);
  const total = Math.min(dataLen, file.size - dataOff);
  const per = Math.floor(fmt.sr * sliceSec) * block;
  for (let off = 0; off < total; off += per){
    const len = Math.min(per, total - off);
    const body = await rdb(file, dataOff+off, dataOff+off+len);
    const wav = new Uint8Array(44 + body.length);
    const v = new DataView(wav.buffer);
    const w = (o,s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4, 36+body.length, true); w(8,'WAVEfmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,fmt.ch,true);
    v.setUint32(24,fmt.sr,true); v.setUint32(28,fmt.sr*block,true);
    v.setUint16(32,block,true); v.setUint16(34,fmt.bits,true);
    w(36,'data'); v.setUint32(40, body.length, true); wav.set(body,44);
    yield { bytes: wav, sec: len/block/fmt.sr };
  }
}
const MP3_BR = { 1:[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320,0],
                 2:[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160,0] };
const MP3_SR = [44100,48000,32000];
async function* mp3Slices(file, sliceSec){
  let pos = 0;
  const h = await rdb(file,0,10);
  if (str4(h,0).slice(0,3)==='ID3'){
    pos = 10 + ((h[6]&0x7f)<<21 | (h[7]&0x7f)<<14 | (h[8]&0x7f)<<7 | (h[9]&0x7f));
    if (h[5] & 0x10) pos += 10;
  }
  const WIN = 1<<22;
  let win = new Uint8Array(0), winStart = pos, acc = [], accSec = 0;
  const need = async (at,n) => {
    if (at < winStart || at + n > winStart + win.length){
      winStart = at; win = await rdb(file, at, at + WIN);
    }
    return at - winStart;
  };
  while (pos + 4 <= file.size){
    let i = await need(pos,4);
    if (win.length - i < 4) break;
    if (!(win[i]===0xFF && (win[i+1]&0xE0)===0xE0)){ pos++; continue; }
    const ver = (win[i+1]>>3)&3, layer = (win[i+1]>>1)&3;
    if (ver===1 || layer!==1){ pos++; continue; }
    const brIdx = (win[i+2]>>4)&15, srIdx = (win[i+2]>>2)&3, pad = (win[i+2]>>1)&1;
    if (brIdx===0 || brIdx===15 || srIdx===3){ pos++; continue; }
    const mpeg1 = ver===3, br = MP3_BR[mpeg1?1:2][brIdx]*1000;
    let sr = MP3_SR[srIdx]; if (ver===2) sr/=2; else if (ver===0) sr/=4;
    const flen = (mpeg1 ? Math.floor(144*br/sr) : Math.floor(72*br/sr)) + pad;
    if (flen < 24){ pos++; continue; }
    i = await need(pos, flen);
    if (win.length - i < flen) break;
    acc.push(win.slice(i,i+flen)); accSec += (mpeg1?1152:576)/sr; pos += flen;
    if (accSec >= sliceSec){ yield { bytes:cat(acc), sec:accSec }; acc = []; accSec = 0; }
  }
  if (acc.length) yield { bytes:cat(acc), sec:accSec };
}
async function mp4Index(file){
  let p = 0, moov = null;
  while (p + 8 <= file.size){
    const h = await rdb(file, p, p+16);
    let size = be32(h,0); const type = str4(h,4); let hdr = 8;
    if (size === 1){ size = be32(h,8)*4294967296 + be32(h,12); hdr = 16; }
    if (size === 0) size = file.size - p;
    if (type === 'moov'){ moov = await rdb(file, p+hdr, p+size); break; }
    p += size;
  }
  if (!moov) throw new Error('MP4_NO_MOOV');
  const boxes = (buf,want) => {
    const out = []; let q = 0;
    while (q + 8 <= buf.length){
      let sz = be32(buf,q); const ty = str4(buf,q+4); let hd = 8;
      if (sz === 1){ sz = be32(buf,q+8)*4294967296 + be32(buf,q+12); hd = 16; }
      if (sz < 8 || q + sz > buf.length) break;
      if (ty === want) out.push(buf.subarray(q+hd, q+sz));
      q += sz;
    }
    return out;
  };
  const dig = (buf,path) => { let cur=[buf]; for (const t of path){ const n=[]; cur.forEach(b=>n.push(...boxes(b,t))); cur=n; if(!cur.length) return null; } return cur; };
  for (const trak of boxes(moov,'trak')){
    const stbl = dig(trak,['mdia','minf','stbl']), mdhd = dig(trak,['mdia','mdhd']);
    if (!stbl || !mdhd) continue;
    const stsd = boxes(stbl[0],'stsd')[0]; if (!stsd) continue;
    const entry = stsd.subarray(8);
    if (str4(entry,4) !== 'mp4a') continue;
    const timescale = be32(mdhd[0], mdhd[0][0]===1 ? 20 : 12);
    const mp4a = entry.subarray(8);
    let asc = null;
    for (let q = 28; q + 8 < mp4a.length; q++){
      if (str4(mp4a,q)==='esds'){
        const es = mp4a.subarray(q+8);
        for (let r = 0; r + 2 < es.length; r++){
          if (es[r] === 0x05){
            let len = 0, rr = r+1, b;
            do { b = es[rr++]; len = (len<<7) | (b & 0x7f); } while (b & 0x80);
            asc = es.subarray(rr, rr+len); break;
          }
        }
        break;
      }
    }
    if (!asc) continue;
    const aot = asc[0] >> 3, srIdx = ((asc[0]&7)<<1) | (asc[1]>>7), chCfg = (asc[1]>>3)&15;
    const b = t => boxes(stbl[0],t)[0];
    const stsz = b('stsz'), stco = b('stco'), co64 = b('co64'), stsc = b('stsc'), stts = b('stts');
    if (!stsz || !stsc || !stts || (!stco && !co64)) continue;
    const n = be32(stsz,8), uniform = be32(stsz,4);
    const sizes = new Uint32Array(n);
    for (let k=0;k<n;k++) sizes[k] = uniform || be32(stsz, 12+k*4);
    const cN = be32(stco||co64,4), cOff = new Float64Array(cN);
    for (let k=0;k<cN;k++) cOff[k] = stco ? be32(stco,8+k*4) : (be32(co64,8+k*8)*4294967296 + be32(co64,12+k*8));
    const scN = be32(stsc,4), sc = [];
    for (let k=0;k<scN;k++) sc.push({ first:be32(stsc,8+k*12), per:be32(stsc,12+k*12) });
    const durs = new Float64Array(n);
    { const m = be32(stts,4); let s = 0;
      for (let k=0;k<m && s<n;k++){
        const cnt = be32(stts,8+k*8), del = be32(stts,12+k*8);
        for (let j=0;j<cnt && s<n;j++) durs[s++] = del/timescale;
      } }
    const offsets = new Float64Array(n);
    let s = 0;
    for (let ci=0; ci<cN && s<n; ci++){
      let per = sc[sc.length-1].per;
      for (let k=0;k<sc.length;k++){
        const nf = (k+1<sc.length) ? sc[k+1].first : Infinity;
        if (ci+1 >= sc[k].first && ci+1 < nf){ per = sc[k].per; break; }
      }
      let o = cOff[ci];
      for (let j=0;j<per && s<n;j++){ offsets[s] = o; o += sizes[s]; s++; }
    }
    let total = 0; for (let k=0;k<n;k++) total += durs[k];
    return { n, sizes, offsets, durs, srIdx, chCfg, aot, total };
  }
  throw new Error('MP4_NO_AAC');
}
function adtsHeader(len, srIdx, chCfg, aot){
  const profile = Math.max(1,aot)-1, fl = len + 7;
  return new Uint8Array([0xFF,0xF1,(profile<<6)|(srIdx<<2)|(chCfg>>2),
    ((chCfg&3)<<6)|(fl>>11),(fl>>3)&0xFF,((fl&7)<<5)|0x1F,0xFC]);
}
async function* mp4Slices(file, sliceSec, ix){
  let i = 0;
  while (i < ix.n){
    const parts = []; let sec = 0; const start = i;
    while (i < ix.n && sec < sliceSec){ sec += ix.durs[i]; i++; }
    let k = start;
    while (k < i){
      let j = k;
      while (j+1 < i && ix.offsets[j+1] === ix.offsets[j] + ix.sizes[j]) j++;
      const from = ix.offsets[k], to = ix.offsets[j] + ix.sizes[j];
      const buf = await rdb(file, from, to);
      for (let m = k; m <= j; m++){
        const o = ix.offsets[m]-from, sz = ix.sizes[m];
        parts.push(adtsHeader(sz, ix.srIdx, ix.chCfg, ix.aot), buf.subarray(o,o+sz));
      }
      k = j+1;
    }
    yield { bytes: cat(parts), sec };
  }
}
async function decodeBytes(u8){
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC(); let buf;
  const ab = u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.length);
  try { buf = await ac.decodeAudioData(ab); } finally { try{ ac.close(); }catch(e){} }
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(buf.duration*16000)), 16000);
  const s = off.createBufferSource(); s.buffer = buf; s.connect(off.destination); s.start();
  return (await off.startRendering()).getChannelData(0);
}
// শেষ ১৫ সেকেন্ডের সবচেয়ে নীরব জায়গা — শব্দের মাঝখানে কাটা এড়াতে
function quietCut(pcm, sr){
  const win = Math.floor(sr*0.25), from = Math.max(0, pcm.length - 15*sr);
  let best = pcm.length, bestE = Infinity;
  for (let i = from; i + win < pcm.length; i += win){
    let e = 0;
    for (let j = i; j < i+win; j += 4) e += pcm[j]*pcm[j];
    if (e < bestE){ bestE = e; best = i; }
  }
  return best;
}
async function openAudio(file){
  const type = await detectType(file);
  if (type === 'wav') return { type, totalSec: 0, gen: f => wavSlices(f, CHUNK_SEC) };
  if (type === 'mp3') return { type, totalSec: 0, gen: f => mp3Slices(f, CHUNK_SEC) };
  if (type === 'mp4'){
    const ix = await mp4Index(file);
    return { type, totalSec: ix.total, gen: f => mp4Slices(f, CHUNK_SEC, ix) };
  }
  return { type:'other', totalSec: 0, gen: async function*(f){
    const pcm = await decodeToMono16k(f);
    yield { pcm, sec: pcm.length/16000 };
  } };
}

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                 (window.matchMedia && window.matchMedia('(max-width:820px)').matches);
const CHUNK_SEC = isMobile ? 300 : 600;          // ফোনে ছোট খণ্ড — কম ডেটা, কম মেমোরি
const netErrorish = e => /fail|network|load|timeout|abort|connection/i.test((e && (e.name + ' ' + e.message)) || '');

async function transcribeOnce(wav, offsetSec){
  let r = await sttCall(wav, 'verbose_json');
  if (!r.ok && (r.status === 400 || r.status === 422)) r = await sttCall(wav, 'json');
  if (!r.ok){
    let msg = r.status + '';
    try { const j = await r.json(); msg = (j.error && j.error.message) || msg; } catch(e){}
    if (r.status === 401) msg = T('keyBad');
    if (r.status === 429) msg = T('rateLimit');
    const err = new Error(msg); err.http = r.status; throw err;
  }
  const j = await r.json();
  if (Array.isArray(j.segments) && j.segments.length)
    return j.segments.map(s => ({ t:(offsetSec + (s.start||0)) * 1000, sp:'', text:(s.text||'').trim() }))
                     .filter(s => s.text);
  const txt = (j.text || '').trim();
  return txt ? [{ t: offsetSec*1000, sp:'', text: txt }] : [];
}

// নেটওয়ার্ক কেটে গেলে নিজে থেকেই আবার চেষ্টা করে (মোবাইল ডেটার জন্য জরুরি)
async function transcribeChunk(wav, offsetSec){
  const keepMsg = $('progTxt').innerHTML;
  for (let att = 0; att <= 3; att++){
    try { return await transcribeOnce(wav, offsetSec); }
    catch(e){
      if (aborter && aborter.signal.aborted) throw e;
      const retriable = !e.http && netErrorish(e);      // HTTP ভুল হলে বারবার চেষ্টা করে লাভ নেই
      if (!retriable || att === 3){
        if (retriable) throw new Error(T('netGone'));
        throw e;
      }
      if (navigator.onLine === false){
        setProg(50, '<span class="err">' + T('offline') + '</span>');
        while (navigator.onLine === false){
          if (aborter && aborter.signal.aborted) throw new Error(T('cancelled'));
          await sleep(1500);
        }
      }
      setProg(50, '<span class="err">' + T('retrying') + num(att+1) + T('retryTail') + '</span>');
      await sleep(3000 * (att + 1));
      $('progTxt').innerHTML = keepMsg;
    }
  }
}
async function handleFile(file){
  if (!cfg().key){ $('apiBox').open = true; $('keyMsg').innerHTML = '<span class="err">'+T('needKey')+'</span>'; return; }
  aborter = new AbortController();
  $('btnCancel').style.display = 'inline-block';
  try {
    const mbFile = (file.size/1048576).toFixed(file.size > 1073741824 ? 0 : 1);
    setProg(2, T('scanning') + ' <span style="opacity:.7;font-weight:400">(' + T('fileIs') + ': ' +
      esc(file.name).slice(0,40) + ' · ' + num(mbFile) + ' MB)</span>');
    let src;
    try { src = await openAudio(file); }
    catch(e){ src = { type:'other', totalSec:0, gen: async function*(f){ const p = await decodeToMono16k(f); yield { pcm:p, sec:p.length/16000 }; } }; }
    if (src.type === 'other'){
      if (file.size > 200*1024*1024) throw new Error(T('tooBigOther'));
      setProg(3, T('fmtOther'));
    }
    if (src.totalSec){
      const estSec = Math.max(src.totalSec/20, src.totalSec > 7200 ? src.totalSec/2 : 0);
      setProg(4, T('longFile') + hms(src.totalSec*1000) + T('longFileTail') + hms(estSec*1000) +
        (src.totalSec > 7200 ? '<br><span class="err">' + T('hourLimit') + '</span>' : ''));
      await sleep(2500);
    }

    const sr = 16000;
    let carry = new Float32Array(0), base = 0, idx = 0, doneSec = 0;
    const est = src.totalSec || (file.size / (isMobile ? 1000000 : 1000000) * 60);   // মোটামুটি হিসাব

    const flush = async (pcm) => {
      if (!pcm.length) return;
      idx++;
      const mb = (pcm.length*2/1048576).toFixed(1);
      const pct = Math.min(96, 5 + 91 * (est ? doneSec/est : idx/(idx+2)));
      setProg(pct, T('converting') + num(idx) +
        ' <span style="opacity:.7;font-weight:400">(' + hms(base*1000) +
        (src.totalSec ? ' / ' + hms(src.totalSec*1000) : '') +
        ' · ' + T('sending') + ' ' + num(mb) + ' MB)</span>');
      const segs = await transcribeChunk(encodeWav(pcm, sr), base);
      S.segs.push(...segs);
      base += pcm.length / sr;
      renderTranscript(); autosave();
    };

    for await (const part of src.gen(file)){
      if (aborter.signal.aborted) throw new Error(T('cancelled'));
      let pcm;
      if (part.pcm) pcm = part.pcm;
      else {
        try { pcm = await decodeBytes(part.bytes); }
        catch(e){ throw new Error(T('badFormat')); }
      }
      doneSec += part.sec || pcm.length/sr;
      if (carry.length){
        const j = new Float32Array(carry.length + pcm.length);
        j.set(carry); j.set(pcm, carry.length); pcm = j;
      }
      const cut = quietCut(pcm, sr);
      carry = pcm.slice(cut);
      await flush(pcm.subarray(0, cut));
    }
    await flush(carry); carry = new Float32Array(0);

    S.elapsed = Math.max(S.elapsed, base*1000);
    $('timer').textContent = hms(S.elapsed);
    setProg(100, '<span class="ok">' + T('doneMark') + num(S.segs.length) + T('partsDone') + '</span>');
    setTimeout(() => setProg(null), 8000);
    autoExtract();
  } catch(e){
    setProg(100, '<span class="err">' + T('problem') + esc(e.message || String(e)) + '</span>');
  } finally { $('btnCancel').style.display = 'none'; aborter = null; }
}
$('btnCancel').onclick = () => { if (aborter) aborter.abort(); };
$('drop').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => { if (e.target.files[0]) handleFile(e.target.files[0]); e.target.value=''; };
['dragenter','dragover'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });

const M = { display:null, mic:null, ac:null, dest:null, rec:null, chunks:[], rot:null,
            running:false, started:0, offset:0, queue:[], busy:false, parts:0 };
const SEG_MIN = 8;
function mimeType(){
  const list = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  for (const m of list) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
function meetState(on, txt){
  $('mdot').className = 'dot' + (on ? ' live' : '');
  $('mState').textContent = txt;
  $('btnMeet').disabled = on; $('btnMeetStop').disabled = !on;
}
async function startMeet(){
  if (!cfg().key){ $('apiBox').open = true; return alert(T('needKey')); }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return alert(T('noShareApi'));
  let display;
  try {
    display = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface:'browser' },
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false },
      systemAudio: 'include', selfBrowserSurface: 'exclude' });
  } catch(e){ return; }
  if (!display.getAudioTracks().length){
    display.getTracks().forEach(t => t.stop());
    return alert(T('noAudioShared'));
  }
  let mic = null;
  try { mic = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } }); } catch(e){}
  const AC = window.AudioContext || window.webkitAudioContext;
  M.ac = new AC(); M.dest = M.ac.createMediaStreamDestination();
  const join = (s, g) => { const gn = M.ac.createGain(); gn.gain.value = g; M.ac.createMediaStreamSource(s).connect(gn).connect(M.dest); };
  join(display, 1.0); if (mic) join(mic, 0.9);
  M.display = display; M.mic = mic; M.running = true; M.viaMic = false;
  M.started = Date.now(); M.offset = 0; M.parts = 0;
  $('meetInfo').innerHTML = mic ? T('meetBoth') : T('meetOnly');
  display.getVideoTracks()[0].addEventListener('ended', () => { if (M.running) stopMeet(); });
  meetState(true, T('meetRunning'));
  meetTick(); startSegment();
}
function startSegment(){
  const mt = mimeType(); M.chunks = [];
  M.rec = new MediaRecorder(M.dest.stream, mt ? { mimeType: mt } : undefined);
  M.rec.ondataavailable = e => { if (e.data && e.data.size) M.chunks.push(e.data); };
  M.rec.onstop = () => {
    if (M.chunks.length){ M.queue.push(new Blob(M.chunks, { type: M.rec.mimeType || 'audio/webm' })); drainQueue(); }
    if (M.running) startSegment();
  };
  M.rec.start();
  M.rot = setTimeout(() => { if (M.rec && M.rec.state === 'recording') M.rec.stop(); }, SEG_MIN * 60 * 1000);
}
function stopMeet(){
  M.running = false; clearTimeout(M.rot);
  try { if (M.rec && M.rec.state !== 'inactive') M.rec.stop(); } catch(e){}
  [M.display, M.mic].forEach(s => { if (s) s.getTracks().forEach(t => t.stop()); });
  if (M.ac) { try { M.ac.close(); } catch(e){} }
  if (!M.viaMic) meetState(false, T('stDone'));
  S.elapsed = Math.max(S.elapsed, Date.now() - M.started);
  $('timer').textContent = hms(S.elapsed);
  setTimeout(() => drainQueue(true), 400);
}
async function drainQueue(finishing){
  if (M.busy){ if (finishing) M.finishAfter = true; return; }
  if (!M.queue.length){
    if (finishing || M.finishAfter){ M.finishAfter = false; await afterMeeting(); }
    return;
  }
  M.busy = true;
  const blob = M.queue.shift(); M.parts++;
  const keep = aborter;
  aborter = aborter || new AbortController();
  try {
    setProg(40, T('meetPart') + num(M.parts) + T('meetPartTail') +
      (M.queue.length ? ' (' + T('meetLeft') + num(M.queue.length) + T('meetLeftTail') + ')' : ''));
    const pcm = await decodeToMono16k(blob);
    const sr = 16000, pts = splitPoints(pcm, sr, CHUNK_SEC);
    for (let i = 0; i < pts.length - 1; i++){
      const segs = await transcribeChunk(encodeWav(pcm.subarray(pts[i], pts[i+1]), sr), M.offset + pts[i]/sr);
      S.segs.push(...segs); renderTranscript();
    }
    M.offset += pcm.length / sr; autosave();
    setProg(100, '<span class="ok">' + T('partAdded') + num(M.parts) + T('partAddedTail') + '</span>');
    if (M.running) setTimeout(() => setProg(null), 4000);
  } catch(e){
    setProg(100, '<span class="err">' + T('problem') + esc(e.message || String(e)) + '</span>');
  } finally {
    aborter = keep; M.busy = false;
    drainQueue(finishing || M.finishAfter);
  }
}
async function afterMeeting(){
  setProg(null);
  if (!S.segs.length) return;
  autoExtract();
  if (!$('autoFinish').checked) return;
  await aiStructure();
  if (S.decisions.length || S.actions.length || $('mSummary').value.trim()){
    save(makeDocxBlob(), fileBase() + '.docx');
    setProg(100, '<span class="ok">' + T('docDone') + '</span>');
    setTimeout(() => setProg(null), 8000);
  }
}
function meetTick(){
  if (!M.running) return;
  $('mTimer').textContent = hms(Date.now() - M.started);
  setTimeout(meetTick, 1000);
}
(function mobileCheck(){
  const noShare = !navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia;

function aiRules(){
  const outLang = LANG === 'bn' ? 'বাংলায় লেখো (ইংরেজি পরিভাষা যেমন আছে তেমন রাখো)'
                                : 'Write in English (keep technical terms as spoken)';
  return 'You are an experienced office secretary turning a raw meeting transcript into professional minutes. ' +
         'The transcript may contain misheard words — correct them from context. ' + outLang + '. ' +
         'Never invent facts. Reply with JSON only.\n';
}
const SCHEMA_FULL = '{"title":"","summary":"","agenda":[""],"discussion":[{"topic":"","points":[""]}],' +
                    '"decisions":[""],"actions":[{"task":"","who":"","due":""}],"attendees":[""]}';
const SCHEMA_MAP  = '{"discussion":[{"topic":"","points":[""]}],"decisions":[""],"actions":[{"task":"","who":"","due":""}]}';

const sleep = ms => new Promise(r => setTimeout(r, ms));
const estTokens = s => Math.ceil(s.length / 2.2) + 600;
let nextCallAt = 0;

async function waitUntil(ts, why){
  while (Date.now() < ts){
    if (aborter && aborter.signal.aborted) throw new Error(T('cancelled'));
    setProg(50, why + ' <b>' + num(Math.ceil((ts - Date.now())/1000)) + '</b>' + T('secs'));
    await sleep(500);
  }
}
async function chatJSON(system, user){
  const c = cfg();
  const tok = estTokens(system + user);
  await waitUntil(nextCallAt, T('waitFree'));
  for (let attempt = 0; attempt < 5; attempt++){
    const r = await fetch(c.base + '/chat/completions', {
      method:'POST', signal: aborter.signal,
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + c.key },
      body: JSON.stringify({ model:c.llm, temperature:0.2, response_format:{type:'json_object'},
        messages:[{role:'system',content:system},{role:'user',content:user}] }) });
    nextCallAt = Date.now() + Math.min(60000, Math.ceil(tok / 12000 * 62000));
    if (r.status === 429){
      let sec = parseFloat(r.headers.get('retry-after') || '0');
      let body = ''; try { body = JSON.stringify(await r.json()); } catch(e){}
      if (!sec){ const m = body.match(/try again in ([\d.]+)\s*s/i); sec = m ? parseFloat(m[1]) : 20; }
      await waitUntil(Date.now() + (sec + 2) * 1000, T('waitHit'));
      continue;
    }
    if (!r.ok){
      let m = r.status + ''; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch(e){}
      if (r.status === 401) m = T('keyBad');
      if (r.status === 413) m = T('tooBig');
      throw new Error(m);
    }
    const j = await r.json();
    const raw = j.choices[0].message.content;
    return JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1));
  }
  throw new Error(T('busy'));
}
function splitTranscript(limit){
  const parts = []; let cur = '';
  S.segs.forEach(s => {
    const line = (s.sp ? s.sp + ': ' : '') + s.text + '\n';
    if (cur.length + line.length > limit && cur){ parts.push(cur); cur = ''; }
    cur += line;
  });
  if (cur.trim()) parts.push(cur);
  return parts;
}
async function aiStructure(){
  if (!cfg().key){ $('apiBox').open = true; return alert(T('needKey')); }
  if (!S.segs.length) return alert(T('needAudio'));
  aborter = new AbortController();
  $('btnCancel').style.display = 'inline-block';
  nextCallAt = 0;
  const head = 'Meeting title: ' + ($('mTitle').value || '-') +
               '\nAgenda: ' + ($('mAgenda').value || '-') +
               '\nAttendees: ' + ($('mPresent').value || '-') + '\n\n';
  try {
    const parts = splitTranscript(11000);
    let data;
    if (parts.length === 1){
      setProg(45, T('aiWorking'));
      data = await chatJSON(aiRules() + 'Produce the complete minutes:\n' + SCHEMA_FULL,
                            head + '--- TRANSCRIPT ---\n' + parts[0]);
    } else {
      const notes = { discussion:[], decisions:[], actions:[] };
      for (let i = 0; i < parts.length; i++){
        setProg(10 + 70*i/parts.length, T('aiReading') + num(i+1) + '/' + num(parts.length) + '…');
        const d = await chatJSON(aiRules() + 'This is one part of the transcript. Extract:\n' + SCHEMA_MAP,
                                 head + '--- PART ' + (i+1) + '/' + parts.length + ' ---\n' + parts[i]);
        ['discussion','decisions','actions'].forEach(k => { if (Array.isArray(d[k])) notes[k].push(...d[k]); });
      }
      setProg(85, T('aiMerging'));
      data = await chatJSON(aiRules() + 'Below are notes taken from different parts of the same meeting. ' +
                            'Merge duplicates, order them logically and produce the complete minutes:\n' + SCHEMA_FULL,
                            head + '--- NOTES ---\n' + JSON.stringify(notes).slice(0, 22000));
    }
    applyAI(data);
    setProg(100, '<span class="ok">' + T('aiDone') + '</span>');
    setTimeout(() => setProg(null), 6000);
  } catch(e){
    setProg(100, '<span class="err">' + T('aiProblem') + esc(e.message || String(e)) + '</span>');
  } finally { $('btnCancel').style.display = 'none'; aborter = null; }
}

function applyAI(d){
  if (d.title && !$('mTitle').value.trim()) $('mTitle').value = d.title;
  if (Array.isArray(d.agenda) && d.agenda.length && !$('mAgenda').value.trim())
    $('mAgenda').value = d.agenda.map((a,i) => num(i+1) + '. ' + a).join('\n');
  if (Array.isArray(d.attendees) && d.attendees.length && !$('mPresent').value.trim())

    $('mDiscussion').value = d.discussion.map(t => (t.topic||'') + '\n' + (t.points||[]).map(p => '- ' + p).join('\n')).join('\n\n');
  if (Array.isArray(d.decisions) && d.decisions.length) S.decisions = d.decisions.filter(Boolean);
  if (Array.isArray(d.actions) && d.actions.length)
    S.actions = d.actions.filter(a => a && a.task).map(a => ({ task:a.task, who:a.who||'', due:a.due||'' }));
  $('sumCard').style.display = 'block';
  renderDecisions(); renderActions(); autosave();
  $('sumCard').scrollIntoView({ behavior:'smooth', block:'start' });
}
function parseDiscussion(){
  const out = [];
  ($('mDiscussion').value || '').split('\n').forEach(line => {
    const t = line.trim(); if (!t) return;
    if (/^[-•*]\s*/.test(t)){
      if (!out.length) out.push({ topic:'', points:[] });
      out[out.length-1].points.push(t.replace(/^[-•*]\s*/, ''));
    } else out.push({ topic:t, points:[] });
  });
  return out;
}

$('btnSelfTest').onclick = async () => {
  const out = $('testOut'); out.style.display = 'block'; out.innerHTML = '';
  const line = (t, cls) => out.innerHTML += '<div>' + (cls ? '<span class="'+cls+'">'+t+'</span>' : t) + '</div>';
  const c = cfg();
  if (!c.key){ line(T('keyMissing'), 'err'); return; }
  aborter = new AbortController();
  line(T('tStart'));
  try {
    const r = await fetch(c.base + '/models', { headers:{ Authorization:'Bearer ' + c.key } });
    if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 401 ? ' — ' + T('keyBad') : ''));
    const ids = ((await r.json()).data || []).map(m => m.id);
    line(T('t1') + ' (' + c.p + ', ' + num(ids.length) + T('t1models') + ')', 'ok');
    const okStt = ids.includes(c.stt);
    line((okStt ? T('t2ok') : T('t2bad')) + '“' + c.stt + '”', okStt ? 'ok' : 'err');
    if (!ids.includes(c.llm)) line(T('t2llm') + '“' + c.llm + '”', 'err');
  } catch(e){ line(T('t1fail') + esc(e.message), 'err'); return; }
  try {
    const sr = 16000, n = sr*2, pcm = new Float32Array(n);
    for (let i=0;i<n;i++) pcm[i] = Math.sin(2*Math.PI*220*i/sr) * 0.25 * Math.sin(Math.PI*i/n);
    const t0 = Date.now();
    await transcribeChunk(encodeWav(pcm, sr), 0);
    line(T('t3ok') + ' (' + num(Date.now()-t0) + T('t3ms') + ')', 'ok');
  } catch(e){ line(T('t3fail') + esc(e.message), 'err'); }
  try {
    nextCallAt = 0;
    const d = await chatJSON('Reply with JSON only.',
      'Extract the decision from this sentence: "It was decided that the report must be submitted next Sunday." Format: {"decisions":[""]}');
    line(T('t4ok') + '“' + esc(String((d.decisions && d.decisions[0]) || '-').slice(0,60)) + '”', 'ok');
    line('<b class="ok">' + T('tAllOk') + '</b>');
  } catch(e){ line(T('t4fail') + esc(e.message), 'err'); }
  aborter = null;
};

const FIELDS = ['mTitle','mNo','mDate','mTime','mVenue','mChair','mSecretary','mPresent','mAbsent','mAgenda','mOrg','mSummary','mDiscussion'];

   ============================================================ */
const X = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function runs(text, o){
  o = o||{};
  const rPr = '<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Nirmala UI"/>' +
    (o.b?'<w:b/><w:bCs/>':'') + (o.i?'<w:i/>':'') + (o.color?'<w:color w:val="'+o.color+'"/>':'') +
    '<w:sz w:val="'+(o.sz||22)+'"/><w:szCs w:val="'+(o.sz||22)+'"/></w:rPr>';
  return String(text==null?'':text).split('\n').map((line,i) =>
    '<w:r>' + rPr + (i?'<w:br/>':'') + '<w:t xml:space="preserve">' + X(line) + '</w:t></w:r>').join('');
}
function P(text, o){
  o = o||{};
  const pPr = '<w:pPr>' + (o.align?'<w:jc w:val="'+o.align+'"/>':'') +
    '<w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after==null?120:o.after)+'" w:line="276" w:lineRule="auto"/>' +
    (o.ind?'<w:ind w:left="'+o.ind+'" w:hanging="'+(o.hang||0)+'"/>':'') +
    (o.border?'<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="2" w:color="0D6E5C"/></w:pBdr>':'') + '</w:pPr>';
  return '<w:p>' + pPr + runs(text, o) + '</w:p>';
}
function H(text, lvl){
  return P(text, { b:true, sz: lvl===1?28:24, color: lvl===1?'0D6E5C':'134E4A', before:240, after:120, border: lvl===1 });
}
function CELL(content, w, o){
  o = o||{};
  return '<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>' +
    (o.shade?'<w:shd w:val="clear" w:fill="'+o.shade+'"/>':'') + '<w:vAlign w:val="center"/></w:tcPr>' +
    (Array.isArray(content) ? content.join('') : P(content, {after:40, b:o.b, sz:o.sz||21})) + '</w:tc>';
}
function TABLE(rows, widths, o){
  o = o||{};
  const bd = '<w:tblBorders>' + ['top','left','bottom','right','insideH','insideV']
    .map(s => '<w:'+s+' w:val="single" w:sz="6" w:space="0" w:color="B6C7C2"/>').join('') + '</w:tblBorders>';
  const grid = '<w:tblGrid>' + widths.map(w => '<w:gridCol w:w="'+w+'"/>').join('') + '</w:tblGrid>';
  const body = rows.map((r,ri) => '<w:tr>' + r.map((c,ci) =>
    CELL(c, widths[ci], { shade:(o.header && ri===0) ? 'E8F3EF' : null, b:(o.header && ri===0) || (o.firstColBold && ci===0) })).join('') + '</w:tr>').join('');
  return '<w:tbl><w:tblPr><w:tblW w:w="9360" w:type="dxa"/>' + bd +
    '<w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar>' +
    '</w:tblPr>' + grid + body + '</w:tbl>';
}
const MONTHS = {
 bn:['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'],
 en:['January','February','March','April','May','June','July','August','September','October','November','December']};
function formatDate(iso){
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return LANG === 'bn'
    ? num(d.getDate()) + ' ' + MONTHS.bn[d.getMonth()] + ' ' + num(d.getFullYear()) + ' খ্রিঃ'
    : d.getDate() + ' ' + MONTHS.en[d.getMonth()] + ' ' + d.getFullYear();
}
function buildBody(){
  const v = id => $(id).value.trim();
  const lines = id => v(id).split('\n').map(s=>s.trim()).filter(Boolean);
  const numbered = (arr) => arr.map((n,i) => P((/^[০-৯0-9]/.test(n) ? '' : (num(i+1) + '. ')) + n, { ind:360, after:40 })).join('');
  let b = '';
  if (v('mOrg')) b += P(v('mOrg'), { b:true, sz:30, align:'center', color:'0D6E5C', after:40 });
  b += P(v('mTitle') || T('dMinutes'), { b:true, sz:32, align:'center', after:60 });
  b += P(T('dMinutesSub'), { align:'center', sz:20, color:'555555', after:200 });

  const meta = [];
  if (v('mNo'))    meta.push([T('dNo'), v('mNo')]);
  meta.push([T('dDate'), formatDate(v('mDate'))]);
  if (v('mTime'))  meta.push([T('dTime'), v('mTime')]);
  if (v('mVenue')) meta.push([T('dVenue'), v('mVenue')]);
  if (v('mChair')) meta.push([T('dChair'), v('mChair')]);
  if (S.elapsed)   meta.push([T('dDuration'), hms(S.elapsed)]);
  b += TABLE(meta, [2600, 6760], { firstColBold:true });

  if (lines('mPresent').length){ b += H(T('dPresent'), 2); b += numbered(lines('mPresent')); }
  if (lines('mAbsent').length){  b += H(T('dAbsent'), 2);  b += numbered(lines('mAbsent')); }
  if (lines('mAgenda').length){  b += H(T('dAgenda'), 2);  b += numbered(lines('mAgenda')); }

  if (v('mSummary')){ b += H(T('dSummary'), 1); b += P(v('mSummary'), { align:'both', after:120 }); }

  const disc = parseDiscussion();
  if (disc.length){
    b += H(T('dDiscussion'), 1);
    let n = 0;
    disc.forEach(t => {
      if (t.topic) b += P(num(++n) + '. ' + t.topic, { b:true, sz:23, before:120, after:60 });
      t.points.forEach(p => b += P('•  ' + p, { ind:560, hang:220, after:60 }));
    });
  }
  const dec = S.decisions.filter(d => d.trim());
  if (dec.length){
    b += H(T('dDecisions'), 1);
    dec.forEach((d,i) => b += P(num(i+1) + '. ' + d, { ind:360, hang:360, after:100 }));
  }
  const acts = S.actions.filter(a => a.task.trim());
  if (acts.length){
    b += H(T('dActions'), 1);
    const rows = [[T('dSl'), T('dTask'), T('dWho'), T('dDue')]];
    acts.forEach((a,i) => rows.push([num(i+1), a.task, a.who || '—', a.due || '—']));
    b += TABLE(rows, [700, 4660, 2200, 1800], { header:true });
  }
  if ($('incTranscript').checked && S.segs.length){
    b += H(T('dTranscript'), 1);
    S.segs.forEach(s => {
      const pre = ($('incTime').checked ? '[' + hms(s.t) + '] ' : '') + (s.sp ? s.sp + ': ' : '');
      b += P(pre + s.text, { after:80 });
    });
  }
  if ($('incSign').checked){
    b += P('', { after:400 });
    b += TABLE([[
      [P('', {after:0}), P('_____________________', {align:'center', after:40}),
       P(v('mSecretary') || T('dPrepName'), {align:'center', b:true, sz:21, after:0}),
       P(T('dPreparedBy'), {align:'center', sz:19, color:'555555', after:0})],
      [P('', {after:0}), P('_____________________', {align:'center', after:40}),
       P(v('mChair') || T('dChairSign'), {align:'center', b:true, sz:21, after:0}),
       P(T('dChairSign'), {align:'center', sz:19, color:'555555', after:0})]
    ]], [4680, 4680], {});
  }
  b += P('', {after:0});
  return b;
}
function documentXml(){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
  '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + buildBody() +
  '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
  '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1418" w:header="709" w:footer="709" w:gutter="0"/>' +
  '</w:sectPr></w:body></w:document>';
}
const STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
'<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
'<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Nirmala UI"/>' +
'<w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="en-US" w:bidi="bn-BD"/></w:rPr></w:rPrDefault>' +

'<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>';
const CONTENT_TYPES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
'<Default Extension="xml" ContentType="application/xml"/>' +
'<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
'<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';
const RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
const DOC_RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for (let i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zip(files){
  const enc = new TextEncoder(); const parts = [], central = []; let offset = 0;
  const u16 = n => [n&255,(n>>8)&255];
  const u32 = n => [n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f => {
    const nameB = enc.encode(f.name), data = enc.encode(f.str), crc = crc32(data);
    const local = [].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nameB.length), u16(0));
    parts.push(new Uint8Array(local), nameB, data);
    central.push([].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nameB.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset), Array.from(nameB)));
    offset += local.length + nameB.length + data.length;
  });
  const cd = [].concat(...central);
  const eocd = [].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0), u16(files.length), u16(files.length),
    u32(cd.length), u32(offset), u16(0));
  parts.push(new Uint8Array(cd), new Uint8Array(eocd));
  return new Blob(parts, { type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}
function makeDocxBlob(){
  return zip([
    { name:'[Content_Types].xml', str: CONTENT_TYPES },
    { name:'_rels/.rels',         str: RELS },
    { name:'word/document.xml',   str: documentXml() },
    { name:'word/_rels/document.xml.rels', str: DOC_RELS },
    { name:'word/styles.xml',     str: STYLES_XML }
  ]);
}

function save(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function fileBase(){
  const t = ($('mTitle').value.trim() || T('dFileBase')).replace(/[\\/:*?"<>|]/g,'-');
  return t + ' — ' + ($('mDate').value || '');
}

    if (!confirm(T('emptyDoc'))) return;

  save(makeDocxBlob(), fileBase() + '.docx');

(function boot(){
  try { LANG = localStorage.getItem('mmr_lang') === 'en' ? 'en' : 'bn'; } catch(e){}
  let theme = null;
  try { theme = localStorage.getItem('mmr_theme'); } catch(e){}
  if (!theme) theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  setTheme(theme);

  fillModels();
  try {
    const c = JSON.parse(localStorage.getItem('mmr_cfg') || 'null');
    if (c){
      $('provider').value = c.provider || 'groq'; fillModels();
      $('apiKey').value = c.key || $('apiKey').value;
      if (c.stt) $('sttModel').value = c.stt;
      if (c.llm) $('llmModel').value = c.llm;
      $('upLang').value = c.lang || '';
    }
  } catch(e){}

  // রেকর্ডিং পদ্ধতি: ফোনে বা লাইভ সাপোর্ট না থাকলে Whisper-ই ডিফল্ট
  let rm = null;
  try { rm = localStorage.getItem('mmr_recmode'); } catch(e){}
  if (!rm) rm = 'whisper';                              // সব জায়গায় এটাই বেশি নির্ভরযোগ্য ও নির্ভুল
  $('recMode').value = rm;
  if (location.protocol === 'file:' || !SR){
    if (location.protocol === 'file:') $('fileWarn').style.display = 'block';
    $('btnStart').disabled = false;                     // Whisper মোডে কাজ করবে
  }

  applyLang();
  saveCfg();
  if (!$('apiKey').value) $('apiBox').open = true;
  setState(false, false, T('stReady'));
  renderDecisions(); renderActions(); countWords();

  try {
    const d = JSON.parse(localStorage.getItem('mmr_draft') || 'null');
    if (d && ((d.segs||[]).length || (d.f && d.f.mTitle)) && confirm(T('restore'))){
      FIELDS.forEach(k => { if (d.f[k] != null) $(k).value = d.f[k]; });
      S.segs = d.segs||[]; S.decisions = d.decisions||[]; S.actions = d.actions||[]; S.elapsed = d.elapsed||0;
      renderTranscript(); renderDecisions(); renderActions();
      $('timer').textContent = hms(S.elapsed);
      if ($('mSummary').value.trim() || $('mDiscussion').value.trim()) $('sumCard').style.display = 'block';
    }
  } catch(e){}
})();
